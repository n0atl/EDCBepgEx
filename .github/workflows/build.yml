name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # tag builds attach the ZIP to a GitHub Release
    steps:
      # build.ps1 expects the EDCB source next to this repository.
      - uses: actions/checkout@v7
        with:
          path: EDCBepgEx

      - name: Checkout EDCB reference source
        uses: actions/checkout@v7
        with:
          repository: xtne6f/EDCB
          ref: e6e3c614d0a8b287b0072e084f509494cd203e7e
          path: EpgCollector-reference

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A v1.2.3 tag builds version 1.2.3; other builds are named dev-<commit>.
      - name: Build
        shell: pwsh
        working-directory: EDCBepgEx
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          .\build.ps1 -Version $version

      # Upload the ZIP as-is so the download is not a ZIP inside a ZIP.
      - uses: actions/upload-artifact@v7
        with:
          path: EDCBepgEx/EDCBepgEx-*.zip
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: EDCBepgEx
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item EDCBepgEx-*.zip).FullName --title "EDCBepgEx $env:GITHUB_REF_NAME" --generate-notes
